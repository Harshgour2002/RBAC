spring:
  application:
    name: RBAC
  datasource:
    url: jdbc:mysql://localhost:3308/rbac_db
    username: ${DB_USERNAME:rbac_user}
    password: ${DB_PASSWORD:rbac_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

security:
  jwt:
    # base64 encoded 256-bit secret default for local dev only; override in production
    secret: ${JWT_SECRET:MS3IeVCphIXxfup22t5LjoY34DSreL3m47bQOlzvSxMpY6LESpPLrzWyaYMI1PrGpkDPLYJ8iZOGR/REe7q9eg==}
    # Access token = 15 minutes in milliSeconds
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
    # Refresh token = 7 days in milliSeconds
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}

logging:
  level:
    org.springframework.security: INFO
