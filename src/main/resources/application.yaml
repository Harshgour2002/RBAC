spring:
  application:
    name: RBAC
  datasource:
    url: jdbc:mysql://localhost:3308/rbac_db
    username: ${DB_USERNAME:rbac_user}
    password: ${DB_PASSWORD:rbac_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

security:
  jwt:
    # base64 encoded 256-bit secret default for local dev only; override in production
    secret: ${JWT_SECRET:YjY0LWRldi1zZWNyZXQteHl6LXVuaXZlcnNpdHktYXV0aC0zMi1ieXRlcw==}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}

logging:
  level:
    org.springframework.security: INFO
